<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Mealio — Dark Gourmet Food Delivery</title>
    <meta name="description" content="Order premium food online with real-time delivery tracking. North Indian, Biryani, South Indian, street food and more." />
    <meta name="theme-color" content="#FF6B35" />

    <!-- Favicon + PWA icons -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Open Graph (looks good when shared on WhatsApp, Twitter, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Mealio — Dark Gourmet Food Delivery" />
    <meta property="og:description" content="Premium food ordering with real-time order tracking and mock payment flow." />
    <meta property="og:image" content="/icon-512.png" />

    <!-- iOS PWA standalone support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mealio" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
